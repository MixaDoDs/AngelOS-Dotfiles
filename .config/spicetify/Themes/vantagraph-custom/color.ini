; Vantagraph Custom - base colours
;
; Every colour is edited inside Spotify: gear icon > Colors tab. What you pick
; there is saved per user and painted on top of this file, so you never have
; to touch it. This file is the starting palette (VantagraphBlack) and what
; Spotify shows for the split second before theme.js runs.
;
; theme.js holds the same defaults (COLOR_KEYS). Change both together.
; Colours with opacity, and colours that follow another one (Menu Text,
; Icons, Icon Hover, Play Icon, the glass tints), live only in theme.js.
;
; Surfaces
; window: backmost app background, seen between the panels
; panel: left, main and right panel background
; panel-hover: hovered rows and buttons, right panel cards
; menu: right-click menu and card background
; player: bottom player bar and the Next Track card
; stroke: borders and the player bar top edge
; tab-active: selected tab and filter chip background
; Text
; text: titles, song names, links, body text
; subtext: artists, descriptions, captions, timestamps
; Buttons & Accent
; accent: wave, Next Track card, playing track, focus rings
; btn-active: shuffle, repeat and other switched-on buttons
; play-btn: fill of every play button
; play-btn-hover: play button fill on hover
; heart: liked-song heart
; Progress Bars
; bar-fill: filled part of the playback and volume bars
; bar-bg: empty part of the playback and volume bars
; Spotify's own colours
; shadow, selected-row, button, button-disabled, notification,
; notification-error, misc


[VantagraphBlack]
