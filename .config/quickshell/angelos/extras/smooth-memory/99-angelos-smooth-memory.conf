# angelOS (extras/smooth-memory): no multi-second freezes of the picture when RAM fills up —
# a game, a browser and zram swap at once. Installed by the dotfiles (as the author has it).
# kswapd starts freeing earlier (a 2 % gap above the low watermark instead of 0.1 %), so the
# compositor gets its memory without reclaiming it itself in the middle of a frame
vm.watermark_scale_factor = 200
# background compaction keeps runs of free pages: the compositor and the NVIDIA driver ask for
# 32 KB at once (order 3), and with none left they stall in compaction or wake the OOM killer
# (the kernel's own default; CachyOS sets 0)
vm.compaction_proactiveness = 20
