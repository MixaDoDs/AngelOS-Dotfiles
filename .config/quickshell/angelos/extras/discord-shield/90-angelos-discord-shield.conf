# angelOS: Discord doesn't see single programs' playback streams when they all play through
# virtual mix sinks (extras/discord-shield/discord-shield.lua)
wireplumber.components = [
  {
    name = angelos/discord-shield.lua, type = script/lua
    provides = custom.angelos-discord-shield
  }
]
wireplumber.profiles = {
  main = {
    custom.angelos-discord-shield = required
  }
}
