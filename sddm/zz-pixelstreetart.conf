# SDDM login screen for the PixelStreetArt Niri rice.
# Installed by install.sh to /etc/sddm.conf.d/zz-pixelstreetart.conf.
#
# SDDM reads /etc/sddm.conf.d/* in alphabetical order and the last value wins,
# hence the "zz-" prefix: an older drop-in (e.g. theme.conf) cannot override it.
# /etc/sddm.conf is read after this directory; install.sh comments out a
# conflicting [Theme] Current= there (with a backup).

[Theme]
Current=pixel-cyberpunk
CursorTheme=capitaine-cursors
